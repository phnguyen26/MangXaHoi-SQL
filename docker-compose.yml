services:
  mysql-db:
    image: mysql:8.4
    container_name: my_mysql_db
    #restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 53443
      MYSQL_DATABASE: CHUDE14
      MYSQL_USER: root

      MYSQL_PASSWORD: 53443
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: my_phpmyadmin
    #restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
    ports:
      - "8080:80"

volumes:
  mysql_data:
